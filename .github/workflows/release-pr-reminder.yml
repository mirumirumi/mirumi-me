name: release-pr-reminder

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  remind:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body "⚠️ リリース PR なのでマージコミットありでマージしてね！"
