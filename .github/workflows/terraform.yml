name: terraform

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/dev/terraform
      - deploy/prd/terraform
    paths:
      - terraform/**
      - .github/workflows/terraform.yml

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ github.ref_name == 'deploy/prd/terraform' && 'prd' || 'dev' }}
    steps:
      - uses: actions/checkout@v6

      # ロールは環境ごとに分かれている。dev から本番の DNS や distribution へは到達できない
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/mirumime-${{ env.ENV_NAME }}-ci

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - name: Apply
        working-directory: terraform/envs/${{ env.ENV_NAME }}
        run: |
          terraform init
          terraform plan
          terraform apply --auto-approve
