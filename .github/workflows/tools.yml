name: tools

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: |
          bun run --cwd tools/migrate-to-notion tsc
          bun run --cwd tools/site-admin-extension tsc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run --cwd tools/migrate-to-notion test
