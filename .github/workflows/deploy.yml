name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Enable only when in use
      - chore/migrate-nuxt-4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
    
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Install Python modules
        run: pip3 install httpx

      - name: Decrypt secrets with gpg
        run: |
          echo "${{ secrets.GPG_PASSPHRASE }}" \
            | sudo gpg --batch --passphrase-fd 0 --output "app/src/secrets/secret.dev.js" --decrypt "app/src/secrets/secret.dev.js.gpg"
          echo "${{ secrets.GPG_PASSPHRASE }}" \
            | sudo gpg --batch --passphrase-fd 0 --output "app/src/secrets/secret.prd.js" --decrypt "app/src/secrets/secret.prd.js.gpg"

      - name: Generate site
        run: |
          bun run --cwd app generate

      - name: Generate XMLs
        run: |
          python3 .github/workflows/generate_sitemaps.py
          python3 .github/workflows/generate_feeds.py

      - name: Sign in
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ap-northeast-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Copy files to S3
        env:
          ENV_NAME: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}
        run: |
          bucket="s3://mirumime-${ENV_NAME}-mirumi-me"
          aws configure set default.s3.max_concurrent_requests 40

          aws s3 sync \
            --region ap-northeast-1 \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "builds/*" \
            app/.output/public/_nuxt/ "${bucket}/_nuxt/"
          aws s3 sync \
            --region ap-northeast-1 \
            --cache-control "no-cache" \
            app/.output/public/_nuxt/builds/ "${bucket}/_nuxt/builds/"
          aws s3 sync \
            --region ap-northeast-1 \
            --delete \
            --cache-control "no-cache" \
            --exclude "_nuxt/*" \
            --exclude "apps/*" \
            --exclude "assets/components/*" \
            app/.output/public/ "${bucket}/"

      - name: Purge CDN caches
        env:
          DISTRIBUTION_ID: ${{ github.ref_name == 'main' && 'E1UPWIMHFP5TEC' || 'E16GU2ZPNLT91U' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${DISTRIBUTION_ID} \
            --paths "/*"
